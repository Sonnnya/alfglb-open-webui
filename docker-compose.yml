name: openwebui

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:0.10.2
    container_name: openwebui
    restart: always
    ports:
      - "8061:8080"
    environment:
      DATABASE_URL: postgresql://owui:${PG_PASSWORD}@postgres:5432/openwebui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: openwebui-pg
    restart: always
    environment:
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: openwebui
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owui -d openwebui"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  open-webui:
    name: open-webui
  pgdata:
    name: openwebui-pgdata