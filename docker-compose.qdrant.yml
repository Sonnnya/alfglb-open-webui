name: openwebui

services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:0.10.2 # TODO: 0.6.5
    container_name: openwebui
    restart: always
    ports:
      - "8061:8080"
    environment:
      DATABASE_URL: postgresql://owui:${PG_PASSWORD}@postgres:5432/openwebui
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      VECTOR_DB: "qdrant"
      QDRANT_URI: "http://qdrant:6333"
    volumes:
      - ./open-webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: openwebui-pg
    restart: always
    environment:
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: openwebui
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owui -d openwebui"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:latest # TODO: pin version
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage