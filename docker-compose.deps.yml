name: alfglb

services:
  # app:
  #   build: .
  #   container_name: alfglb-app
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: postgresql://owui:${PG_PASSWORD}@postgres:5432/openwebui
  #     QDRANT_URI: "http://qdrant:6333"
  #     QDRANT_COLLECTION_PREFIX: "open-webui"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     qdrant:
  #       condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: openwebui-pg
    restart: always
    environment:
      POSTGRES_USER: owui
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: openwebui
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owui -d openwebui"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"  # REST
      - "6334:6334"  # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
